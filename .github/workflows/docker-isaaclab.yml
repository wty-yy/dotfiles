name: Build and Push Isaac Lab Image

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docker/isaaclab/**'
      - 'docker/ubuntu/**'
      - '.github/workflows/docker-isaaclab.yml'
      - '.github/workflows/docker-ubuntu.yml'
  workflow_dispatch:
    inputs:
      isaaclab_version:
        description: 'Image tag or package version from versions.json; use "all" to build every version'
        required: false
        default: 'all'

env:
  UBUNTU_TAG: 24.04

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build matrix
        id: matrix
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.isaaclab_version }}
        run: |
          set -euo pipefail
          config="docker/isaaclab/versions.json"
          requested_version="${REQUESTED_VERSION:-all}"

          jq -e '
            type == "array" and
            length > 0 and
            all(
              .[];
              [
                .image_tag,
                .isaaclab_version,
                .python_version,
                .torch_version,
                .torchvision_version,
                .pytorch_cuda,
                .uv_prerelease
              ] | all(type == "string" and length > 0)
            )
          ' "$config" >/dev/null

          if [ "$requested_version" = "all" ]; then
            matrix="$(jq -c '{include: .}' "$config")"
          else
            matrix="$(
              jq -c --arg version "$requested_version" '
                {
                  include: map(
                    select(
                      .image_tag == $version or
                      .isaaclab_version == $version
                    )
                  )
                }
              ' "$config"
            )"
          fi

          if [ "$(jq '.include | length' <<<"$matrix")" -eq 0 ]; then
            echo "Unknown Isaac Lab version: $requested_version" >&2
            exit 1
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-base:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base Ubuntu image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/ubuntu
          file: ./docker/ubuntu/Dockerfile
          push: true
          build-args: |
            UBUNTU_TAG=${{ env.UBUNTU_TAG }}
          tags: |
            wtyyy/ubuntu:${{ env.UBUNTU_TAG }}

  build-and-push:
    name: Isaac Lab ${{ matrix.image_tag }}
    needs:
      - prepare
      - build-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Isaac Lab image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/isaaclab
          file: ./docker/isaaclab/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=wtyyy/ubuntu:${{ env.UBUNTU_TAG }}
            ISAACLAB_VERSION=${{ matrix.isaaclab_version }}
            PYTHON_VERSION=${{ matrix.python_version }}
            TORCH_VERSION=${{ matrix.torch_version }}
            TORCHVISION_VERSION=${{ matrix.torchvision_version }}
            PYTORCH_CUDA=${{ matrix.pytorch_cuda }}
            UV_PRERELEASE=${{ matrix.uv_prerelease }}
          tags: |
            wtyyy/isaaclab:${{ matrix.image_tag }}
